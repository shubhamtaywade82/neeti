services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neeti
      POSTGRES_PASSWORD: neeti_dev
      POSTGRES_DB: neeti_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neeti -d neeti_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build: .
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    environment:
      DATABASE_URL: postgresql://neeti:neeti_dev@db:5432/neeti_development
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:4b
      RAILS_ENV: development
      JWT_SECRET_KEY: dev_jwt_secret_change_in_production
      CORS_ORIGINS: http://localhost:5174,http://localhost:5173
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
    develop:
      watch:
        - action: sync
          path: .
          target: /rails
          ignore:
            - log/
            - tmp/
            - frontend/

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_BACKEND_URL=http://app:3000
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5173"
    deploy:
      resources:
        limits:
          memory: 1G
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

  worker:
    build: .
    command: bundle exec rails solid_queue:start
    environment:
      DATABASE_URL: postgresql://neeti:neeti_dev@db:5432/neeti_development
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pg_data:
  bundle_cache:
