  expect_no_grounding: true

- query: "What's the weather in Mumbai today?"
  theme: real_time_data
  expect_no_grounding: true

- query: "How do I compile a Rust program?"
  theme: programming
  expect_no_grounding: true

- query: "What's the best pizza topping?"
  theme: trivial_opinion
  expect_no_grounding: true

- query: "When was the Taj Mahal built?"
